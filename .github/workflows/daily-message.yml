name: Generate daily footer message

on:
  schedule:
    # 05:00 UTC daily — well before anyone in Belgrade is likely browsing.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/generate-daily-message.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit updated message
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/daily-message.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh daily footer message"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # A commit pushed with the default GITHUB_TOKEN above does not itself
  # trigger deploy.yml's `push` event, so call it directly — only when the
  # message actually changed.
  deploy:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
