<!doctype html>
<html lang="en" data-mode="professional" data-route="home">

    <!-- Resolve the mode and the route before first paint, so there is no flash of the other persona.
         ES5 on purpose; src/lib/mode.test.ts runs it against parseMode / parseRoute. -->
    <script data-prepaint>
      (function () {
        var d = document.documentElement, m = 'professional', h = '';
        try {
          m = new URLSearchParams(location.search).get('mode') === 'personal' ? 'personal' : 'professional';
          h = location.hash;
        } catch (e) {}
        var S = ['mesara', 'dev-dashboard']; /* the ids with a case study (mode.test.ts checks) */
        var r = h === '#resume' ? 'cv' : h.indexOf('#project/') === 0 && S.indexOf(h.slice(9)) >= 0 ? 'study' : 'home';
        d.setAttribute('data-mode', m);
        d.setAttribute('data-route', r);
        if (m === 'personal' && r === 'home') {
          document.title = 'Ratko · Personal';
          var t = document.querySelector('meta[name="theme-color"]');
          if (t) t.setAttribute('content', '#15130F');
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = '/ratko/ratko-square-l.webp';
          l.setAttribute('imagesrcset', '/ratko/ratko-square-l-480.webp 480w, /ratko/ratko-square-l.webp 800w');
          l.setAttribute('imagesizes', '(max-width: 720px) 25vw, (max-width: 860px) 34vw, (max-width: 1100px) 25vw, 16vw');
          l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        }
      })();
    </script>
